name: Tasks tests

on:
  pull_request:
    paths:
      - "apps/tasks/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/tasks-tests.yml"
  push:
    branches: [main]

concurrency:
  group: tasks-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tasks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Lint tasks workspace
        run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
